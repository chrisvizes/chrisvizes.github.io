<!--
  TabNext + D360 Quiz.

  Usage, in any post or page:
    {% raw %}{% include tabnext-quiz.html %}{% endraw %}

  Questions come from assets/quiz/bank.json, generated by export-to-blog.js in the
  assessment project. Never hand-edit those files: re-run the export instead, and
  the quiz picks up new questions with no change here.

  Markup is deliberately thin. The engine in assets/js/quiz.js builds every screen,
  because the seven answer styles need different controls and there is no sense
  shipping markup for six of them on every view. Everything is scoped behind tnq-
  so it cannot collide with the site's own styles or with the icon quiz.
-->
<div class="tnq" data-tnq
     data-src="{{ '/assets/quiz/' | relative_url }}"
     data-rounds="{{ include.rounds | default: 10 }}">

  <div class="tnq-boot" role="status">Loading the question bank…</div>

  <div class="tnq-pick" hidden></div>
  <div class="tnq-play" hidden></div>
  <div class="tnq-end" hidden></div>

  <noscript>
    <p class="tnq-note">This quiz needs JavaScript switched on. The questions themselves
    come from the Salesforce documentation, and every one of them links back to the page
    it was taken from.</p>
  </noscript>
</div>

<link rel="stylesheet" href="{{ '/assets/css/quiz.css' | relative_url }}">
<script src="{{ '/assets/js/quiz.js' | relative_url }}" defer></script>
