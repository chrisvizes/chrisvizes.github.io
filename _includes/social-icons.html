{% for item in site.data.settings.social %}
  {% assign first_char = item.link | slice: 0 %}
  {% if first_char == '/' %}
    <a href="{{ site.baseurl }}{{ item.link }}">{% include icon.html name=item.icon %}</a>
  {% else %}
    <a href="{{ item.link }}" target="_blank">{% include icon.html name=item.icon %}</a>
  {% endif %}
{% endfor %}
